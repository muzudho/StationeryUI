name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/StationeryUI.Tests -c Release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build StationeryUI.slnx -c Release
      - run: dotnet run --project tests/StationeryUI.Tests -c Release --no-build
      - run: dotnet run --project tests/StationeryUI.Windows.Tests -c Release --no-build
      - run: dotnet pack StationeryUI.slnx -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
